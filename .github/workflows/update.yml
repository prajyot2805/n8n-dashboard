name: Update n8n Dashboard

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 min (GitHub often starts it 5-15 min late)
  workflow_dispatch:      # Enable manual refresh button in GitHub Actions
  push:
    branches:
      - main
    paths:
      - 'update_dashboard.py'
      - 'alarm.py'
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh n8n Execution Analytics
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          python update_dashboard.py

      - name: Outside alarm (Telegram)
        if: always()
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          TIPS_BOT_TOKEN: ${{ secrets.TIPS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python test_alarm.py
          python alarm.py alarm.json 1

      - name: Commit & Push Dashboard Updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json alarm.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh dashboard status [skip ci]" && git push)
