<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Ops</title>
<meta name="description" content="What went out today, what is queued and what needs you: PS5 Shorts and Shadow Legion reels.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --line: #e3e6eb;
  --ink: #14171c; --ink-2: #4b5360; --ink-3: #7b8494;
  --accent: #3b5bdb; --accent-soft: #e8edff;
  --you: #b4530a; --you-soft: #fff1e3; --work: #1f7a4d; --work-soft: #e3f5ec; --wait: #5b6472; --wait-soft: #eef0f3;
  --bar: #3b5bdb; --gta: #c2255c; --gta-soft: #fde8ef; --hd: #1c7ed6; --hd-soft: #e5f1fc; --sl: #7048e8; --sl-soft: #efe9ff;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --line: #2a303b;
    --ink: #eef1f6; --ink-2: #b3bbc8; --ink-3: #7f8897;
    --accent: #7c95ff; --accent-soft: #1f2747;
    --you: #ffa94d; --you-soft: #3a2614; --work: #51cf8f; --work-soft: #12301f; --wait: #a0a8b6; --wait-soft: #232832;
    --bar: #7c95ff; --gta: #f06595; --gta-soft: #3b1626; --hd: #4dabf7; --hd-soft: #10283d; --sl: #a78bfa; --sl-soft: #271d44;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --line: #2a303b;
  --ink: #eef1f6; --ink-2: #b3bbc8; --ink-3: #7f8897;
  --accent: #7c95ff; --accent-soft: #1f2747;
  --you: #ffa94d; --you-soft: #3a2614; --work: #51cf8f; --work-soft: #12301f; --wait: #a0a8b6; --wait-soft: #232832;
  --bar: #7c95ff; --gta: #f06595; --gta-soft: #3b1626; --hd: #4dabf7; --hd-soft: #10283d; --sl: #a78bfa; --sl-soft: #271d44;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
header h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.updated { color: var(--ink-3); font-size: 13px; }
.updated.stale { color: var(--you); }
.pull { font-size: 13px; color: var(--accent); font-weight: 600; text-decoration: none; }
.pull:hover { text-decoration: underline; }
.icon-btn:disabled { opacity: .6; cursor: progress; }
.spacer { flex: 1; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 20px; width: fit-content; max-width: 100%; }
.tab { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tab span[aria-hidden] { margin-right: 6px; }
.tab .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--you); color: var(--surface); font-size: 11px; line-height: 18px; text-align: center; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.kpi .label { color: var(--ink-3); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.kpi .value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.kpi .sub { color: var(--ink-2); font-size: 13px; }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.plats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.plat .label a { text-decoration: none; } .plat .label a:hover { text-decoration: underline; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
h2 small { color: var(--ink-3); font-weight: 500; font-size: 12px; }
.section { margin-bottom: 16px; }
.now { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.now li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.now .you { background: var(--you-soft); } .now .work { background: var(--work-soft); } .now .wait { background: var(--wait-soft); }
.now .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; white-space: nowrap; margin-top: 1px; }
.now .you .tag { background: var(--you); color: var(--surface); } .now .work .tag { background: var(--work); color: var(--surface); } .now .wait .tag { background: var(--wait); color: var(--surface); }
.quiet { color: var(--ink-2); padding: 10px 12px; background: var(--work-soft); border-radius: 10px; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.tl li:first-child { border-top: 0; padding-top: 0; }
.tl .time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
.tl .time small { display: block; color: var(--ink-3); font-weight: 500; font-size: 11px; }
.tl .title { font-weight: 500; overflow-wrap: anywhere; }
.tl .title a { text-decoration: none; } .tl .title a:hover { text-decoration: underline; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; color: var(--ink-3); font-size: 12px; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.gta { background: var(--gta-soft); color: var(--gta); } .pill.hd { background: var(--hd-soft); color: var(--hd); } .pill.sl { background: var(--sl-soft); color: var(--sl); }
.pill.good { background: var(--work-soft); color: var(--work); } .pill.warn { background: var(--you-soft); color: var(--you); }
.muted { color: var(--ink-3); }
.tl .empty .title { color: var(--ink-3); font-style: italic; }
.sum { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; color: var(--ink-2); font-size: 13px; }
.sum b { color: var(--ink); font-size: 16px; }
.qbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 8px 0 10px; }
.qbar span { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--ink-3); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.scroll { overflow-x: auto; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 150px; }
.chart .ax { fill: var(--ink-3); font-size: 10px; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart rect.b { fill: var(--bar); }
.chart rect.hit { fill: transparent; cursor: default; }
.chart rect.hit:hover + rect.b, .chart g:hover rect.b { opacity: .8; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
.lessons { margin: 0; padding-left: 18px; color: var(--ink-2); } .lessons li { margin-bottom: 6px; }
.hidden { display: none !important; }
.err { padding: 14px; border-radius: 10px; background: var(--you-soft); color: var(--you); }
@media (max-width: 860px) { .plats { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .kpi .value { font-size: 24px; } .tab { padding: 8px 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Creator Ops</h1>
    <span class="updated" id="updated">Loading…</span>
    <a class="pull hidden" id="pull" href="https://github.com/prajyot2805/n8n-dashboard/actions/workflows/update.yml" target="_blank" rel="noopener">Pull new data on GitHub ↗</a>
    <span class="spacer"></span>
    <button class="icon-btn" id="refresh" type="button">↻ Refresh</button>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark theme">◐ Theme</button>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-ps5" aria-controls="ps5" aria-selected="true"><span aria-hidden="true">🎮</span> PS5 Shorts<span class="dot hidden"></span></button>
    <button class="tab" role="tab" id="tab-sl" aria-controls="sl" aria-selected="false"><span aria-hidden="true">📸</span> Shadow Legion<span class="dot hidden"></span></button>
  </div>

  <main id="ps5" role="tabpanel" aria-labelledby="tab-ps5"></main>
  <main id="sl" role="tabpanel" aria-labelledby="tab-sl" class="hidden"></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => n == null ? '–' : Number(n).toLocaleString('en-IN');
const IST = { timeZone: 'Asia/Kolkata' };
const dayKey = d => new Date(d).toLocaleDateString('en-CA', IST);
const hm = d => new Date(d).toLocaleTimeString('en-IN', { ...IST, hour: '2-digit', minute: '2-digit', hour12: false });
function dayLabel(d) {
  const k = dayKey(d), t = dayKey(Date.now()), y = dayKey(Date.now() + 864e5);
  return k === t ? 'Today' : k === y ? 'Tomorrow' : new Date(d).toLocaleDateString('en-IN', { ...IST, weekday: 'short', day: 'numeric', month: 'short' });
}
function ago(d) {
  const m = Math.round((Date.now() - new Date(d)) / 6e4);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago';
}
const gamePill = g => g ? `<span class="pill ${/gta/i.test(g) ? 'gta' : /helldivers/i.test(g) ? 'hd' : ''}">${esc(g)}</span>` : '';
const link = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);
const kpi = (label, value, sub, meter) => `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div>${meter != null ? `<div class="meter"><span style="width:${Math.min(100, meter)}%"></span></div>` : ''}</div>`;
function nowList(items, quiet) {
  if (!items.length) return `<div class="quiet">✓ ${quiet}</div>`;
  const tag = { you: 'Needs you', work: 'Working', wait: 'Waiting' };
  const order = { you: 0, work: 1, wait: 2 };
  return `<ul class="now">${items.slice().sort((a, b) => order[a.kind] - order[b.kind]).map(i => `<li class="${i.kind}"><span class="tag">${tag[i.kind]}</span><span>${esc(i.text)}</span></li>`).join('')}</ul>`;
}
function timeCell(at) { return `<div class="time">${at ? hm(at) : '–'}<small>${at ? dayLabel(at) : ''}</small></div>`; }

function barChart(rows, key, label) {
  const W = 560, H = 150, pad = { l: 24, r: 4, t: 8, b: 20 }, n = rows.length;
  const max = Math.max(1, ...rows.map(r => r[key]));
  const step = Math.max(1, Math.ceil(max / 3)), top = step * Math.ceil(max / step);
  const bw = (W - pad.l - pad.r) / n, y = v => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="gl" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pad.l - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  rows.forEach((r, i) => {
    const x = pad.l + i * bw, h = y(0) - y(r[key]), w = Math.max(4, bw - 6);
    const d = new Date(r.day + 'T12:00:00+05:30');
    const lab = d.toLocaleDateString('en-IN', { ...IST, day: 'numeric', month: 'short' });
    g += `<g data-tip="${esc(lab)}: ${r[key]} ${label}"><rect class="hit" x="${x}" y="${pad.t}" width="${bw}" height="${H - pad.t - pad.b}"/>`;
    if (r[key]) g += `<rect class="b" x="${x + 3}" y="${y(r[key])}" width="${w}" height="${h}" rx="3"/>`;
    g += `</g>`;
    if (i % 2 === n % 2 || i === n - 1) g += `<text class="ax" x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${d.toLocaleDateString('en-IN', { ...IST, day: 'numeric' })}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)} per day, last 14 days">${g}</svg><div class="tip"></div></div>`;
}
function wireTips(root) {
  root.querySelectorAll('.chart').forEach(c => {
    const tip = c.querySelector('.tip');
    c.querySelectorAll('g[data-tip]').forEach(g => {
      g.addEventListener('mouseenter', () => { const r = g.getBoundingClientRect(), cr = c.getBoundingClientRect(); tip.textContent = g.dataset.tip; tip.style.left = (r.left - cr.left + r.width / 2) + 'px'; tip.style.top = '40px'; tip.style.display = 'block'; });
      g.addEventListener('mouseleave', () => tip.style.display = 'none');
    });
  });
}

// One tile per platform: Shorts/Reels posted, plus YouTube views or what still waits to be cross-posted.
function platforms(pl) {
  if (!pl) return '';
  const wait = x => x.waiting ? `${nf(x.waiting)} waiting to go out` : 'All caught up';
  const fail = x => x.failed ? ` · <span style="color:var(--you)">${nf(x.failed)} failed</span>` : '';
  const tile = (name, x, sub) => `<div class="card kpi plat"><div class="label"><a href="${esc(x.url)}" target="_blank" rel="noopener">${name} ↗</a></div><div class="value">${nf(x.posted)}</div><div class="sub">${sub}</div></div>`;
  return `<div class="plats">
    ${tile('YouTube Shorts', pl.youtube, `${nf(pl.youtube.views)} views`)}
    ${tile('Instagram Reels', pl.instagram, wait(pl.instagram) + fail(pl.instagram))}
    ${tile('Facebook Reels', pl.facebook, wait(pl.facebook) + fail(pl.facebook))}
  </div>`;
}

function renderPS5(p) {
  if (!p || !p.ok) return `<div class="err">No PS5 data in the latest n8n runs. It fills in again after the next 10-minute run.</div>`;
  const t = p.today, q = p.queue, next = p.up_next.find(u => !u.empty);
  const titleState = { yours: '<span class="pill good">Your title</span>', check_sent: '<span class="pill warn">Title check sent</span>', claude: '<span class="pill">Claude’s title</span>' };
  const gameColor = g => /gta/i.test(g) ? 'var(--gta)' : /helldivers/i.test(g) ? 'var(--hd)' : 'var(--ink-3)';
  const todayItems = [
    ...t.posted.map(s => ({ at: s.at, html: `<div class="title">▶️ ${link(s.url, s.title)}</div><div class="meta">${gamePill(s.game)}<span>Short posted</span><span>· ${nf(s.views)} views</span>${s.ig ? '<span class="pill good">Instagram</span>' : ''}${s.fb_url ? `<a class="pill good" href="${esc(s.fb_url)}" target="_blank" rel="noopener">Facebook</a>` : ''}</div>` })),
    ...t.uploads.map(v => ({ at: v.at, html: `<div class="title">📺 ${link(v.url, v.title)}</div><div class="meta">${gamePill(v.game)}<span>Your video</span><span>· ${esc(v.status.replace('_', ' '))}</span></div>` })),
  ].sort((a, b) => String(a.at).localeCompare(String(b.at)));
  return `
  <div class="kpis">
    ${kpi('Posted today', `${t.posted.length}<span class="muted" style="font-size:16px"> / 6</span>`, next ? `Next at ${hm(next.at)} ${dayLabel(next.at).toLowerCase()}` : 'No slot booked', t.posted.length / 6 * 100)}
    ${kpi('In queue', nf(q.total), `${q.days_left} days of Shorts at 6 a day`)}
    ${kpi('Made today', nf(t.shorts_made), t.clipped.length ? `from ${t.clipped.length} video${t.clipped.length > 1 ? 's' : ''}` : 'No clipping today')}
    ${kpi('Shorts views', nf(p.totals.shorts_views), `${nf(p.totals.shorts_posted)} Shorts · videos ${nf(p.totals.video_views)} views`)}
  </div>
  ${platforms(p.platforms)}
  <div class="card section"><h2>Right now</h2>${nowList(p.now, 'Nothing needs you. Shorts post on their own.')}</div>
  <div class="grid2">
    <div class="card"><h2>Today <small>${new Date().toLocaleDateString('en-IN', { ...IST, weekday: 'long', day: 'numeric', month: 'short' })}</small></h2>
      ${todayItems.length ? `<ul class="tl">${todayItems.map(i => `<li>${timeCell(i.at)}<div>${i.html}</div></li>`).join('')}</ul>` : '<div class="muted">Nothing went out yet today.</div>'}
      ${t.shorts_made ? `<div class="meta" style="margin-top:10px">✂️ ${t.shorts_made} new Shorts made today from: ${t.clipped.map(esc).join(' · ')}</div>` : ''}
    </div>
    <div class="card"><h2>Up next <small>next ${p.up_next.length} slots</small></h2>
      <ul class="tl">${p.up_next.map(u => u.empty ? `<li class="empty">${timeCell(u.at)}<div><div class="title">Empty slot: queue ran out</div></div></li>` :
        `<li>${timeCell(u.at)}<div><div class="title">${esc(u.title)}</div><div class="meta">${gamePill(u.game)}${titleState[u.title_state] || ''}${u.guess ? '<span class="pill" title="Not booked yet: the best unbooked Short is picked at slot time">Likely</span>' : ''}${u.score ? `<span>★ ${esc(u.score)}</span>` : ''}${u.note ? `<span>· ${esc(u.note)}</span>` : ''}</div></div></li>`).join('')}</ul>
    </div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Queue <small>${nf(q.total)} Shorts ready in Drive</small></h2>
      <div class="qbar">${Object.entries(q.by_game).map(([g, n]) => `<span style="width:${n / q.total * 100}%;background:${gameColor(g)}" title="${esc(g)}: ${n}"></span>`).join('')}</div>
      <div class="legend">${Object.entries(q.by_game).map(([g, n]) => `<span><i style="background:${gameColor(g)}"></i>${esc(g)} <b>${n}</b></span>`).join('')}</div>
      <div class="meta" style="margin-top:10px">GTA 6 Shorts post first while any are queued.</div>
    </div>
    <div class="card"><h2>Shorts posted per day <small>last 14 days</small></h2>${barChart(p.per_day, 'posted', 'Shorts posted')}</div>
  </div>
  <div class="card section"><h2>Your videos <small>latest ${p.videos.length}</small></h2>
    <div class="scroll"><table><thead><tr><th>Video</th><th>Uploaded</th><th>Status</th><th class="n">Shorts made</th><th class="n">Posted</th><th class="n">Views</th></tr></thead><tbody>
    ${p.videos.map(v => `<tr><td>${link(v.url, v.title)}<div class="meta">${gamePill(v.game)}</div></td><td class="muted" style="white-space:nowrap">${v.at ? dayLabel(v.at) + ' ' + hm(v.at) : '–'}</td><td><span class="pill ${v.status === 'clipped' ? 'good' : /brief|failed/.test(v.status) ? 'warn' : ''}">${esc(v.status.replace('_', ' ') || '–')}</span></td><td class="n">${esc(v.shorts_made || '–')}</td><td class="n">${esc(v.shorts_posted || '0')}</td><td class="n">${nf(v.views)}</td></tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="card section"><h2>Top Shorts this week <small>by views</small></h2>
    ${p.top_week.length ? `<div class="scroll"><table><thead><tr><th>Short</th><th>Posted</th><th class="n">Views</th></tr></thead><tbody>${p.top_week.map(s => `<tr><td>${link(s.url, s.title)}<div class="meta">${gamePill(s.game)}</div></td><td class="muted" style="white-space:nowrap">${dayLabel(s.at)} ${hm(s.at)}</td><td class="n">${nf(s.views)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="muted">No Shorts this week yet.</div>'}
  </div>`;
}

function renderSL(s) {
  if (!s || !s.ok) return `<div class="err">No Shadow Legion data in the latest n8n runs.</div>`;
  const b = s.budget, next = s.up_next[0];
  const state = { scheduled: '<span class="pill good">Scheduled in Metricool</span>', pending: '<span class="pill warn">Needs the laptop</span>', rendering: '<span class="pill warn">Rendering</span>', planned: '<span class="pill">Planned</span>' };
  const range = d => new Date(d + 'T12:00:00+05:30').toLocaleDateString('en-IN', { ...IST, day: 'numeric', month: 'short' });
  return `
  <div class="kpis">
    ${kpi('Reels this month', `${b.used}<span class="muted" style="font-size:16px"> / ${b.limit}</span>`, `Metricool month ${range(b.from)} – ${range(b.to)}`, b.used / b.limit * 100)}
    ${kpi('Next reel', next ? hm(next.at) : '–', next ? dayLabel(next.at) : 'Nothing planned')}
    ${kpi('Views', nf(s.totals.views), `${nf(s.totals.reach)} reach · ${nf(s.totals.likes)} likes`)}
    ${kpi('Episodes left', nf(s.episodes_left), `${nf(s.totals.posted)} reels posted so far`)}
  </div>
  <div class="card section"><h2>Right now</h2>${nowList(s.now, 'Nothing needs you. The next reel is planned on its own.')}</div>
  <div class="grid2">
    <div class="card"><h2>Today</h2>
      ${s.today.length ? `<ul class="tl">${s.today.map(r => `<li>${timeCell(r.at)}<div><div class="title">${link(r.url, r.title)}</div><div class="meta"><span class="pill sl">${esc(r.id)}</span><span>${esc(r.status)}</span>${r.views != null ? `<span>· ${nf(r.views)} views</span>` : ''}</div></div></li>`).join('')}</ul>` : '<div class="muted">No reel today. Reels go out Mon/Wed/Fri 10:00 and Tue/Thu 18:00.</div>'}
    </div>
    <div class="card"><h2>Up next</h2>
      <ul class="tl">${s.up_next.map(u => `<li>${timeCell(u.at)}<div><div class="title">${esc(u.title)}</div><div class="meta">${state[u.state] || `<span class="pill">${esc(u.state)}</span>`}${u.stage ? `<span>· ${esc(u.stage.replace(/_/g, ' '))}</span>` : ''}</div></div></li>`).join('')}</ul>
    </div>
  </div>
  <div class="card section"><h2>Reels <small>Instagram numbers from Metricool</small></h2>
    <div class="scroll"><table><thead><tr><th>Reel</th><th>Posts</th><th class="n">Views</th><th class="n">Reach</th><th class="n">Likes</th><th class="n">Shares</th><th class="n">Avg watch</th><th class="n">Skip rate</th><th class="n">Score</th></tr></thead><tbody>
    ${s.reels.map(r => `<tr><td>${link(r.url, r.title)}<div class="meta"><span class="pill sl">${esc(r.id)}</span>${r.status === 'scheduled' ? '<span class="pill good">scheduled</span>' : ''}</div></td><td class="muted" style="white-space:nowrap">${r.at ? dayLabel(r.at) + ' ' + hm(r.at) : '–'}</td><td class="n">${nf(r.views)}</td><td class="n">${nf(r.reach)}</td><td class="n">${nf(r.likes)}</td><td class="n">${nf(r.shares)}</td><td class="n">${r.avg_watch != null ? r.avg_watch.toFixed(1) + ' s' : '–'}</td><td class="n">${r.skip_rate != null ? r.skip_rate + ' %' : '–'}</td><td class="n">${nf(r.score)}</td></tr>`).join('')}
    </tbody></table></div>
  </div>
  ${s.lessons.length ? `<div class="card section"><h2>Latest lessons</h2><ul class="lessons">${s.lessons.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>` : ''}`;
}

// Tabs (remembered per viewer; the page works without storage)
function show(id) {
  ['ps5', 'sl'].forEach(k => { $('#' + k).classList.toggle('hidden', k !== id); $('#tab-' + k).setAttribute('aria-selected', String(k === id)); });
  try { localStorage.setItem('tab', id); } catch (e) {}
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
}
$('#tab-ps5').onclick = () => show('ps5');
$('#tab-sl').onclick = () => show('sl');
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['ps5', 'sl'].includes(h)) show(h); });
let start = location.hash.slice(1);
if (!['ps5', 'sl'].includes(start)) { try { start = localStorage.getItem('tab'); } catch (e) {} }
show(['ps5', 'sl'].includes(start) ? start : 'ps5');

// Theme
$('#theme').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', document.documentElement.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

let data = null;
function render() {
  if (!data) return;
  const age = (Date.now() - new Date(data.generated_at)) / 6e4;
  const u = $('#updated');
  u.textContent = watching ? 'Waiting for new data (GitHub takes about a minute)…' : 'Updated ' + ago(data.generated_at) + (age > 90 ? ' · data is old' : '');
  u.classList.toggle('stale', age > 90 && !watching);
  // A static page cannot start a pull itself (that needs a token); when the data is old, offer GitHub's Run workflow button.
  $('#pull').classList.toggle('hidden', age <= 30 || watching);
  $('#ps5').innerHTML = renderPS5(data.ps5);
  $('#sl').innerHTML = renderSL(data.sl);
  wireTips($('#ps5'));
  [['ps5', data.ps5], ['sl', data.sl]].forEach(([k, d]) => {
    const n = ((d && d.now) || []).filter(i => i.kind === 'you').length, dot = $('#tab-' + k + ' .dot');
    dot.textContent = n; dot.classList.toggle('hidden', !n);
  });
}
// The GitHub API serves a new commit at once; Pages can lag a minute. Fall back to the Pages copy.
const API = 'https://api.github.com/repos/prajyot2805/n8n-dashboard/contents/status.json?ref=main';
async function fetchStatus() {
  try {
    const r = await fetch(API + '&t=' + Date.now(), { cache: 'no-store', headers: { Accept: 'application/vnd.github.raw+json' } });
    if (r.ok) return await r.json();
  } catch (e) {}
  const r = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
  return await r.json();
}
let watching = null;
async function load() {
  try {
    const d = await fetchStatus();
    if (watching && d.generated_at !== watching.since) { clearInterval(watching.timer); watching = null; }
    data = d;
    render();
  } catch (e) {
    $('#updated').textContent = 'Could not load status.json';
  }
}
$('#refresh').onclick = async () => {
  const b = $('#refresh');
  b.disabled = true; b.textContent = '↻ Refreshing…';
  await load();
  b.disabled = false; b.textContent = '↻ Refresh';
};
// After you press Run workflow on GitHub, check every 20 s for up to 10 min and show the new data as soon as it lands.
$('#pull').onclick = () => {
  if (!data) return;
  if (watching) clearInterval(watching.timer);
  const until = Date.now() + 10 * 60e3;
  watching = { since: data.generated_at, timer: setInterval(() => {
    if (Date.now() > until) { clearInterval(watching.timer); watching = null; render(); return; }
    load();
  }, 20e3) };
  render();
};
load();
setInterval(load, 5 * 60e3);
setInterval(render, 60e3);
</script>
</body>
</html>
